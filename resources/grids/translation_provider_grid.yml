datagrid:
  translation_provider_grid:
    source:
      type: eloquent
      class: App\Models\TranslationProvider
    columns:
      id:
        label: fields.id
        type: number
        sortable: true
      name:
        label: fields.name
        type: string
        sortable: true
      type:
        label: fields.type
        type: string
        sortable: true
      enabled:
        label: fields.status
        type: boolean
        sortable: true
      is_default:
        label: system.isDefaultProvider
        type: boolean
        sortable: true
    filters:
      global:
        type: string
        fields:
          - name
          - type
    actions:
      update:
        icon: edit
        label: rowActions.edit
      delete:
        icon: delete
        label: rowActions.delete
      test:
        icon: translate
        label: system.testProvider
