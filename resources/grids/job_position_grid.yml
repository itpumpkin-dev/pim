datagrid:
  job_position_grid:
    source:
      type: eloquent
      class: App\Models\JobPosition
    columns:
      name:
        label: fields.name
        type: string
        sortable: true
      enabled:
        label: fields.status
        type: boolean
        sortable: true
    filters:
      global:
        type: string
        fields:
          - name
    actions:
      update:
        icon: edit
        label: rowActions.edit
      delete:
        icon: delete
        label: rowActions.delete
